<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>voxmesh MVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0a0a0a; color: #eee; }
        .match-script { color: #b4a7d6; }
        .match-video { color: #a2c4c9; }
        .match-audio { color: #a4c2f4; }
    </style>
</head>
<body class="p-6 h-screen flex flex-col gap-4">
    <div class="flex gap-6 h-full">
        <!-- 좌측: 미리보기 -->
        <div class="w-2/3 flex flex-col gap-4">
            <canvas id="canvas" width="1280" height="720" class="bg-black w-full rounded-lg border border-gray-800"></canvas>
            <div class="flex gap-4">
                <button id="playBtn" class="bg-white text-black px-6 py-2 rounded font-bold">재생</button>
                <button id="exportBtn" class="bg-red-600 text-white px-6 py-2 rounded font-bold">내보내기</button>
            </div>
        </div>
        <!-- 우측: 대사 입력 -->
        <div class="w-1/3 flex flex-col gap-4">
            <input type="file" id="folderInput" webkitdirectory directory multiple class="text-xs">
            <textarea id="scriptInput" class="flex-1 bg-[#141414] p-4 rounded border border-gray-800" placeholder="대사를 입력하세요..."></textarea>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scriptInput = document.getElementById('scriptInput');
        
        let files = { audio: new Map(), video: new Map() };
        let isExporting = false;

        // 폴더 로드
        document.getElementById('folderInput').onchange = (e) => {
            Array.from(e.target.files).forEach(file => {
                const name = file.name.split('.')[0].replace(/\s+/g, '').toLowerCase();
                if (file.webkitRelativePath.includes('/audio/')) files.audio.set(name, file);
                else if (file.webkitRelativePath.includes('/video/')) files.video.set(name, file);
            });
            alert('로드 완료');
        };

        const playSequence = async (onFrame, onEnd, isExportMode = false, audioCtx = null, audioDest = null) => {
            const lines = scriptInput.value.split('\n');
            for (let line of lines) {
                const key = line.replace(/\s+/g, '').toLowerCase();
                const clip = files.video.get(key) || files.audio.get(key);
                
                if (clip) {
                    const url = URL.createObjectURL(clip.file || clip);
                    const isVideo = files.video.has(key);
                    const media = document.createElement(isVideo ? 'video' : 'audio');
                    media.src = url;
                    
                    if (isExportMode) {
                        const source = audioCtx.createMediaElementSource(media);
                        source.connect(audioDest);
                    }
                    
                    await new Promise(r => {
                        media.onloadedmetadata = () => media.play();
                        media.onended = () => { URL.revokeObjectURL(url); r(); };
                        const loop = () => {
                            if (!media.paused && !media.ended) {
                                onFrame(media, isVideo, line);
                                requestAnimationFrame(loop);
                            }
                        };
                        loop();
                    });
                } else {
                    await new Promise(r => setTimeout(r, 500));
                }
            }
            onEnd();
        };

        // 미리보기 재생
        document.getElementById('playBtn').onclick = () => {
            playSequence((m, v, t) => {
                ctx.fillStyle = 'black'; ctx.fillRect(0,0,1280,720);
                if(v) ctx.drawImage(m, 0, 0, 1280, 720);
                ctx.fillStyle = 'white'; ctx.fillText(t, 640, 680);
            }, () => {});
        };

        // 내보내기 (Export)
        document.getElementById('exportBtn').onclick = async () => {
            if (isExporting) return;
            isExporting = true;
            const audioCtx = new AudioContext();
            const dest = audioCtx.createMediaStreamDestination();
            const stream = new MediaStream([...canvas.captureStream(30).getVideoTracks(), ...dest.stream.getAudioTracks()]);
            const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            const chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.start();

            await playSequence((m, v, t) => {
                ctx.fillStyle = 'black'; ctx.fillRect(0,0,1280,720);
                if(v) ctx.drawImage(m, 0, 0, 1280, 720);
                ctx.fillText(t, 640, 680);
            }, () => {
                recorder.stop();
                recorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'voxmesh_export.webm';
                    a.click();
                    isExporting = false;
                };
            }, true, audioCtx, dest);
        };
    </script>
</body>
</html>
